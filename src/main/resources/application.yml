spring:
  application:
    name: template-batch-consumer-reactive
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

consumer:
  sample:
    id: sample-consumer
    topic: sample-events
    concurrency: 3
    retry:
      max-attempts: 3
      initial-interval-ms: 1000
      multiplier: 2.0
      max-interval-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,consumers
  endpoint:
    health:
      show-details: always
